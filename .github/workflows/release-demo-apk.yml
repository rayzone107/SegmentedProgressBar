name: Release demo APK

# The demo app is deliberately not on any app store: its audience finds this
# library through Maven Central and the README, and Play's Minimum Functionality
# policy is openly hostile to demo builds. It ships instead as an APK attached to
# the GitHub release for the tag the library was published from, so that someone
# evaluating the library can install the Playground without cloning it.
#
# This runs when a release is published, which is the last step of
# docs/PUBLISHING.md. Re-run it by hand against an existing tag if a release was
# published before the signing secrets were in place.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to build and attach the APK to
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Build and attach the demo APK
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      APK_PATH: app/build/outputs/apk/release/app-release.apk

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      # Checked before anything is built, because the alternative to failing here
      # is an APK signed with whatever debug key this runner generated, which
      # would install for nobody who already has the previous release.
      - name: Check the signing key is configured
        env:
          KEYSTORE: ${{ secrets.DEMO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEMO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEMO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DEMO_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE" ] || missing+=(DEMO_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(DEMO_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(DEMO_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(DEMO_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}." \
                 "The one-time setup is step 4 of docs/PUBLISHING.md," \
                 "'The demo APK's signing key'."
            exit 1
          fi

      # The APK carries VERSION_NAME as its versionName, so a tag that disagrees
      # with it would attach an APK labelled as a different release.
      - name: Check the tag matches the version at that tag
        run: |
          # `|| true` because the step runs under `set -eo pipefail`, where a
          # grep that matches nothing would abort before the message below.
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2) || true
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG was cut from VERSION_NAME=$version." \
                 "Fix gradle.properties and re-tag rather than shipping a mislabelled APK."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing key
        env:
          DEMO_KEYSTORE_BASE64: ${{ secrets.DEMO_KEYSTORE_BASE64 }}
        run: printf '%s' "$DEMO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/demo-release.jks"

      - name: Assemble the signed demo APK
        env:
          ORG_GRADLE_PROJECT_demoKeystoreFile: ${{ runner.temp }}/demo-release.jks
          ORG_GRADLE_PROJECT_demoKeystorePassword: ${{ secrets.DEMO_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_demoKeyAlias: ${{ secrets.DEMO_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_demoKeyPassword: ${{ secrets.DEMO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # app/build.gradle.kts falls back to the debug key when the properties are
      # absent, which is right for local and pull request builds and wrong here.
      # This is what makes that fallback impossible to ship by accident. The
      # printed SHA-256 should be identical on every release; a changed one means
      # the key changed and nobody can upgrade in place.
      - name: Verify the APK is signed with the release key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1) || true
          if [ -z "$apksigner" ]; then
            echo "::error::No apksigner found under $ANDROID_HOME/build-tools."
            exit 1
          fi
          certs=$("$apksigner" verify --print-certs "$APK_PATH")
          echo "$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::The APK was signed with a debug key." \
                 "The release signing config did not apply; do not publish this build."
            exit 1
          fi

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="SegmentedProgressBar-demo-$TAG.apk"
          cp "$APK_PATH" "$apk"
          gh release upload "$TAG" "$apk" --clobber

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/demo-release.jks"
