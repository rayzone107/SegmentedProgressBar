name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: API compatibility
        # Fails when the public surface of a published module stops matching
        # its checked-in api/<module>.api dump. Intentional changes are made
        # visible by running apiDump and committing the diff.
        run: ./gradlew :segmented:apiCheck :segmented-compose:apiCheck

      - name: Assemble libraries
        run: ./gradlew :segmented:assembleRelease :segmented-compose:assembleRelease

      - name: Assemble demo app
        run: ./gradlew :app:assembleRelease

      - name: Verify the published artifacts resolve
        run: >-
          ./gradlew :segmented:publishReleasePublicationToMavenLocal
          :segmented-compose:publishReleasePublicationToMavenLocal

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
