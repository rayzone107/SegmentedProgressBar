[versions]
# Build toolchain.
#
# The Kotlin version is deliberately absent: AGP 9 compiles Kotlin itself and
# applying org.jetbrains.kotlin.android alongside it is an error, so the Kotlin
# version is whatever this AGP bundles (2.2.10 for AGP 9.3.1). That is the
# combination Google tests, and consumers on a newer Kotlin simply resolve their
# own newer kotlin-stdlib. To pin a different Kotlin, set
# `android.builtInKotlin=false` and apply the Kotlin plugin explicitly.
agp = "9.3.1"

# SDK levels, API 37 (Android 17) is the current stable platform.
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

# Library dependencies
androidxAnnotation = "1.10.0"

# Compose.
# The Compose compiler plugin version must match the Kotlin version AGP bundles
# (2.2.10 for AGP 9.3.1), they are one compiler, shipped as two artifacts.
composeCompiler = "2.2.10"
composeBom = "2026.08.00"
activityCompose = "1.13.0"

# Demo-app-only dependencies
material = "1.14.0"
androidxAppcompat = "1.8.0"
androidxConstraintlayout = "2.2.2"
androidxCore = "1.19.0"

# Test dependencies
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
junit = "4.13.2"
robolectric = "4.16.1"
truth = "1.4.5"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# Compose. Versions come from the BOM, so the individual artifacts carry none.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
