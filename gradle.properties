# Project-wide Gradle settings.
# Docs: https://docs.gradle.org/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX only; the legacy com.android.support artifacts are gone.
android.useAndroidX=true
# Each module gets its own R class instead of one bloated transitive R.
android.nonTransitiveRClass=true

kotlin.code.style=official

# Published version of the :segmented library. JitPack overrides this with the
# git tag via -Pversion, so this value only applies to local builds.
VERSION_NAME=2.0.0

# NOTE: publishing credentials and GPG signing keys must never live in this file.
# It is committed to a public repository. Use ~/.gradle/gradle.properties or
# environment variables instead.
