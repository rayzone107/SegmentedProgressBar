# JitPack build configuration.
#
# AGP 9 requires JDK 17+, and JitPack's default JDK is older than that, so it has
# to be selected explicitly.
#
# Only the two library modules are published. The :app module is a demo, and
# building it on JitPack would just be wasted time and an extra way for a release
# to fail.
jdk:
  - openjdk17

# The publication is named `maven` (the publish plugin's own), so this is
# publishToMavenLocal rather than a publish<Name>PublicationToMavenLocal task.
# JitPack harvests whatever lands in the local repository and re-serves it under
# its own com.github.rayzone107.SegmentedProgressBar coordinates, so the
# io.github group these modules now declare for Maven Central does not change
# what JitPack consumers ask for.
install:
  - >-
    ./gradlew
    :segmented:publishToMavenLocal
    :segmented-compose:publishToMavenLocal
    -x test --no-daemon
